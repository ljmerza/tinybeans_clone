<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <!-- Browser/status-bar color; follows the OS light/dark setting (styles.css --background). -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#09090b"
    />
    <meta
      name="description"
      content="Circles: a private place to share family photos and videos with the people closest to you."
    />
    <!-- Home-screen install: manifest for Android/Chrome, apple-* tags for iOS Safari. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Circles" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Circles</title>
    <script>
      // Apply the saved light/dark mode and color theme before first paint so
      // the page doesn't flash the default palette. Mirrors ThemeProvider.tsx.
      (function () {
        try {
          var root = document.documentElement;
          // Read a key, moving a value saved under its pre-rename
          // "tinybeans.*" name to it first.
          var read = function (key) {
            var value = localStorage.getItem("circles." + key);
            if (value !== null) return value;
            value = localStorage.getItem("tinybeans." + key);
            if (value !== null) {
              localStorage.setItem("circles." + key, value);
              localStorage.removeItem("tinybeans." + key);
            }
            return value;
          };
          var mode = read("themePreference");
          var dark =
            mode === "dark" ||
            (mode !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
          var color = read("colorTheme");
          if (color && color !== "default") {
            root.setAttribute("data-color-theme", color);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
