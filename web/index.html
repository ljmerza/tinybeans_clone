<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-tsrouter-app"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Create TanStack App - web</title>
    <script>
      // Apply the saved light/dark mode and color theme before first paint so
      // the page doesn't flash the default palette. Mirrors ThemeProvider.tsx.
      (function () {
        try {
          var root = document.documentElement;
          var mode = localStorage.getItem("tinybeans.themePreference");
          var dark =
            mode === "dark" ||
            (mode !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
          var color = localStorage.getItem("tinybeans.colorTheme");
          if (color && color !== "default") {
            root.setAttribute("data-color-theme", color);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
