user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    # client_max_body_size. entrypoint.sh rewrites this file at start from the
    # app's upload limits (`manage.py upload_body_limit`): the largest allowed
    # file plus poster and multipart room, so the app answers oversized files
    # with its own error. The image ships a fallback for its default limits.
    include /etc/nginx/upload-limit.conf;

    access_log /dev/stdout;
    error_log /dev/stderr warn;


    # Real client IP. Expected chain: Cloudflare -> upstream reverse proxy ->
    # this nginx -> gunicorn. The upstream proxy restores the visitor IP (for
    # example from CF-Connecting-IP) and appends it to X-Forwarded-For. A
    # published container port delivers that proxy's traffic from a Docker
    # bridge address, so only loopback and Docker's 172.16.0.0/12 are trusted.
    # nginx walks X-Forwarded-For from the right, skipping trusted hops, and
    # stops at the first untrusted address. Anything a client wrote further
    # left is ignored.
    #
    # Do NOT add 10.0.0.0/8 or 192.168.0.0/16. LAN clients are clients: if
    # their range were trusted, nginx would skip a LAN client's own address
    # and believe whatever X-Forwarded-For it sent. Connections from untrusted
    # peers keep their TCP address and their headers are ignored.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Is the TCP peer (before realip rewrites $remote_addr) one of the proxies
    # trusted above? Keep this list in step with set_real_ip_from.
    geo $realip_remote_addr $from_trusted_proxy {
        default        0;
        127.0.0.1      1;
        ::1            1;
        172.16.0.0/12  1;
    }

    # The scheme Django sees (SECURE_PROXY_SSL_HEADER / SECURE_SSL_REDIRECT).
    # A trusted proxy that terminated TLS says so in X-Forwarded-Proto. Anyone
    # else, such as a LAN client on the published port, gets this nginx's own
    # scheme, so a plain-HTTP request can't claim https by sending the header.
    map "$from_trusted_proxy:$http_x_forwarded_proto" $forwarded_proto {
        default   $scheme;
        "1:https" https;
        "1:http"  http;
    }

    upstream django {
        server 127.0.0.1:8000;
    }

    server {
        listen 80;
        server_name _;

        location /static/ {
            alias /app/mysite/staticfiles/;
            expires 30d;
            access_log off;
        }

        location ~ ^/(api|admin|health)/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            # $remote_addr is the client resolved above. Replace X-Forwarded-For
            # instead of appending ($proxy_add_x_forwarded_for), so Django gets
            # one address this nginx vouches for and none of the client-written
            # entries. Django trusts only 127.0.0.1 (DJANGO_TRUSTED_PROXY_IPS).
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_redirect off;
            # A body over client_max_body_size: answer API clients in the
            # app's JSON error shape instead of nginx's HTML page.
            error_page 413 @request_too_large;
        }

        # Prometheus scrape target. Only loopback, Docker and private (LAN)
        # addresses get through; the public reverse proxy should 404 it too.
        # $remote_addr is the client realip resolved, so a public visitor
        # relayed by a trusted proxy is denied. Django's bearer token
        # (METRICS_TOKEN) is the real guard.
        location = /metrics {
            allow 127.0.0.1;
            allow ::1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_redirect off;
        }

        location @request_too_large {
            default_type application/json;
            return 413 '{"error":"file_too_large","messages":[{"i18n_key":"errors.file_too_large","context":{}}]}';
        }

        location / {
            root /app/web/dist;
            try_files $uri $uri/ /index.html;
        }
    }
}
